[package]
name = "officecli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "officecli"
path = "src/main.rs"

[dependencies]
handler-common = { path = "../handler-common" }
oxml = { path = "../oxml" }
docx-handler = { path = "../docx-handler" }
xlsx-handler = { path = "../xlsx-handler" }
pptx-handler = { path = "../pptx-handler" }
pdf-handler = { path = "../pdf-handler" }
hcd-core = { path = "../hcd-core" }
hcd-formats = { path = "../hcd-formats" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
colored = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
lopdf = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
futures = "0.3"
async-stream = "0.3"
office_oxide = { workspace = true }
tempfile = { workspace = true }
ironpress = { version = "=1.6.0", default-features = false }
unicode-segmentation = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
zip = { workspace = true }
